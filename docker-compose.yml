services:
  zeus:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - zeus-data:/data
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      - DATABASE_PATH=/data/project-zeus.db

volumes:
  zeus-data:
